[package]
name = "kepler-ui"
description = "Genesis local UI: loopback HTTP server with a read-only JSON API (internal crate, not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kepler-storage.workspace = true
kepler-memory.workspace = true
kepler-ipc.workspace = true
kepler-policy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
