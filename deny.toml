# Minimal cargo-deny policy (run by .github/workflows/security.yml).
# Validated locally with cargo-deny 0.22.0 (`cargo deny check`: advisories, bans, licenses, sources ok).
# BSD-2/3-Clause stay allowed although no current dependency needs them (reported as warnings only).

[advisories]
yanked = "deny"

[licenses]
# Workspace crates are MIT and `publish = false`: ignore them (private).
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
