name: Release npm (Pi adapter)

# MANUAL, GUARDED publication of @kepler/pi. As committed this workflow CANNOT publish:
# the `guard` job fails while adapters/pi/package.json has "private": true,
# version 0.0.0, no tests. Changing those conditions requires an explicit,
# reviewed maintainer decision (AGENTS.md; see RELEASING.md).
#
# Publishing uses npm trusted publishing (OIDC): there is no NPM_TOKEN secret anywhere.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Version in adapters/pi/package.json being released (e.g. 0.1.0)'
        required: true
        type: string
      confirm:
        description: 'Type exactly: publish <package name>@<version>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  guard:
    name: guard (must pass before anything else)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check release gates
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          CONFIRM: ${{ inputs.confirm }}
        run: node .github/scripts/check-npm-release-gates.mjs
      - name: Typecheck and test
        working-directory: adapters/pi
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

  publish:
    name: publish to npm (manual approval)
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required reviewers on this environment; the job waits for manual approval.
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # ships npm >= 11.5.1, required for trusted publishing
      - name: Install and test
        working-directory: adapters/pi
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Publish with provenance
        working-directory: adapters/pi
        run: npm publish --provenance --access public --ignore-scripts
