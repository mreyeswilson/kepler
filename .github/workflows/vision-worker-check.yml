name: Vision worker check

on:
  push:
    paths:
      - 'workers/vision/**'
      - '.github/workflows/vision-worker-check.yml'
  pull_request:
    paths:
      - 'workers/vision/**'
      - '.github/workflows/vision-worker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-check:
    name: typecheck, build, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: workers/vision
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/vision/package-lock.json
      # No browser is downloaded: installing the Playwright package does not fetch Chromium, and
      # install scripts are disabled anyway.
      - name: Install dependencies (lockfile, no scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests (node:test, fake browser driver)
        run: npm test
      - name: Validate manifest (private, no install scripts)
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (p.private !== true) throw Error('The worker must stay private');
            if (p.scripts && (p.scripts.postinstall || p.scripts.preinstall || p.scripts.install)) throw Error('Install scripts are forbidden');
          "
