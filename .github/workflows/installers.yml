name: Installers check

on:
  push:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/installers/**'
      - '.github/scripts/**'
      - '.github/workflows/installers.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/installers/**'
      - '.github/scripts/**'
      - '.github/workflows/installers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-sh:
    name: install.sh (shellcheck + local release test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner image)
        run: shellcheck --shell=sh install.sh && shellcheck --shell=bash tests/installers/test-install-sh.sh
      - name: Syntax check with dash
        run: dash -n install.sh
      - name: Test against a simulated release (checksum ok / bad / unsupported arch)
        run: bash tests/installers/test-install-sh.sh

  install-ps1:
    name: install.ps1 (Windows PowerShell 5.1 local release test)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test against a simulated release
        shell: powershell
        run: ./tests/installers/test-install-ps1.ps1

  release-gates:
    name: npm release gate script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test .github/scripts/check-npm-release-gates.test.mjs
