name: Release binaries

# `git tag vX.Y.Z && git push origin vX.Y.Z` builds the `kepler` CLI for 5 targets, packages it,
# attaches build-provenance attestations and publishes a GitHub Release with autogenerated notes.
# No workflow artifacts are used (no upload-artifact/download-artifact, so the Actions artifact
# storage quota is irrelevant): preflight creates the Release as a DRAFT, every build job uploads
# its package straight to it, and the final job writes SHA256SUMS and un-drafts the release, so
# that "latest" never points at an incomplete release.
# The tag must equal the kepler-cli version in Cargo.toml (preflight enforces it).
#
# Asset names (deterministic, documented in RELEASING.md):
#   kepler-<version>-<target>.tar.gz   (Linux, macOS)    kepler-<version>-<target>.zip   (Windows)
#   Each archive holds one directory kepler-<version>-<target>/ with the binary, LICENSE and README.md.
#   SHA256SUMS lists every archive ("<sha256>  <file>").
#
# - Tag push `v*`        : full pipeline (draft release, build, attest, upload, checksums, publish).
# - workflow_dispatch    : dry run (build + package + checksum printed in the log; nothing is
#                          uploaded, attested or released).
# Prerelease tags (vX.Y.Z-rc.1) are published as GitHub prereleases (not returned by "latest").
# The publishing job runs in the `release` environment: add required reviewers to it in the repo
# settings if you want a manual approval before anything becomes public (it works without them).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release (tag pushes only)
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Resolve version and check the tag matches Cargo
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="kepler-cli") | .version')"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag '$REF_NAME' is not a semver tag (vX.Y.Z[-pre])"; exit 1
            fi
            if [ "${REF_NAME#v}" != "$cargo_version" ]; then
              echo "::error::Tag $REF_NAME does not match kepler-cli version $cargo_version"; exit 1
            fi
            echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${cargo_version}-dryrun.${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the draft release (idempotent)
        if: steps.v.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          cat > notes.md <<NOTES
          Install: see the README "Install" section (\`install.sh\` / \`install.ps1\`), or download an archive below.

          Verify a download:
          - checksums: \`sha256sum --check --ignore-missing SHA256SUMS\`
          - provenance: \`gh attestation verify <archive> --repo ${REPO}\`

          Binaries are not code-signed or notarized (macOS Gatekeeper / Windows SmartScreen may warn); integrity
          is provided by SHA256SUMS and the build-provenance attestation. License: MIT.
          NOTES
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft $prerelease \
            --title "Kepler $TAG" --notes-file notes.md --generate-notes

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Elevated permissions only here: upload to the draft release and attest the package.
    permissions:
      contents: write # upload the package to the draft release
      id-token: write # sign provenance (OIDC)
      attestations: write # store provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, archive: zip }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No dependency cache on purpose: release artifacts must not depend on restorable cache state.
      - name: Build
        run: cargo build --release --locked -p kepler-cli --target ${{ matrix.target }}
      - name: Smoke test (native runners only)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe=kepler; case "$TARGET" in *windows*) exe=kepler.exe;; esac
          "target/$TARGET/release/$exe" version
      - name: Package and checksum
        id: pkg
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="kepler-${VERSION}-${TARGET}"
          exe=kepler; case "$TARGET" in *windows*) exe=kepler.exe;; esac
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && 7z a -tzip -bd "$name.zip" "$name" > /dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          file="$name.$ARCHIVE"
          # sha256sum on Linux/Windows (Git Bash), shasum on macOS; same "<hash>  <file>" format.
          if command -v sha256sum > /dev/null 2>&1; then
            (cd dist && sha256sum "$file" > "$file.sha256")
          else
            (cd dist && shasum -a 256 "$file" > "$file.sha256")
          fi
          cat "dist/$file.sha256"
          echo "file=dist/$file" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.preflight.outputs.is_release == 'true'
        with:
          subject-path: ${{ steps.pkg.outputs.file }}
      - name: Upload package to the draft release
        if: needs.preflight.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$FILE" "$FILE.sha256" --repo "$REPO" --clobber

  publish:
    name: checksums and publish release
    needs: [preflight, build]
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release # optional required reviewers = manual approval before publishing
    permissions:
      contents: write # upload SHA256SUMS and publish the release
      id-token: write # sign provenance (OIDC)
      attestations: write # store the provenance attestation for SHA256SUMS
    steps:
      - name: Assemble SHA256SUMS from the uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --repo "$REPO" --pattern 'kepler-*.sha256' --dir dist
          cd dist
          test "$(ls kepler-*.sha256 | wc -l)" -eq 5
          cat kepler-*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - name: Upload SHA256SUMS, drop the per-file checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/SHA256SUMS --repo "$REPO" --clobber
          for f in dist/kepler-*.sha256; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$REPO" --yes
          done
          # Un-draft last: "latest" only ever resolves to a complete release.
          gh release edit "$TAG" --repo "$REPO" --draft=false
