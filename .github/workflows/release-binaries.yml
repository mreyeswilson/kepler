name: Release binaries

# `git tag vX.Y.Z && git push origin vX.Y.Z` builds the `kepler` CLI for 5 targets, packages it,
# writes SHA256SUMS, attaches build-provenance attestations and PUBLISHES a GitHub Release with
# autogenerated notes (published, not draft, so the installers can download "latest").
# The tag must equal the kepler-cli version in Cargo.toml (preflight enforces it).
#
# Asset names (deterministic, documented in RELEASING.md):
#   kepler-<version>-<target>.tar.gz   (Linux, macOS)    kepler-<version>-<target>.zip   (Windows)
#   Each archive holds one directory kepler-<version>-<target>/ with the binary, LICENSE and README.md.
#   SHA256SUMS lists every archive ("<sha256>  <file>").
#
# - Tag push `v*`        : full pipeline (build, checksums, attest, publish release).
# - workflow_dispatch    : dry run (build + package + checksums as workflow artifacts only;
#                          no attestation, no release).
# Prerelease tags (vX.Y.Z-rc.1) are published as GitHub prereleases (not returned by "latest").
# The publishing job runs in the `release` environment: add required reviewers to it in the repo
# settings if you want a manual approval before anything becomes public (it works without them).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Resolve version and check the tag matches Cargo
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name=="kepler-cli") | .version')"
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag '$REF_NAME' is not a semver tag (vX.Y.Z[-pre])"; exit 1
            fi
            if [ "${REF_NAME#v}" != "$cargo_version" ]; then
              echo "::error::Tag $REF_NAME does not match kepler-cli version $cargo_version"; exit 1
            fi
            echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${cargo_version}-dryrun.${SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-15, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, archive: zip }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No dependency cache on purpose: release artifacts must not depend on restorable cache state.
      - name: Build
        run: cargo build --release --locked -p kepler-cli --target ${{ matrix.target }}
      - name: Smoke test (native runners only)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe=kepler; case "$TARGET" in *windows*) exe=kepler.exe;; esac
          "target/$TARGET/release/$exe" version
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="kepler-${VERSION}-${TARGET}"
          exe=kepler; case "$TARGET" in *windows*) exe=kepler.exe;; esac
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && 7z a -tzip -bd "$name.zip" "$name" > /dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kepler-${{ matrix.target }}
          path: dist/kepler-*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: checksums
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kepler-*
          merge-multiple: true
          path: dist
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(ls kepler-* | wc -l)" -eq 5
          sha256sum kepler-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: attest and publish release
    needs: [preflight, checksums]
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release # optional required reviewers = manual approval before publishing
    # Elevated permissions live only in this job.
    permissions:
      contents: write # create the release
      id-token: write # sign provenance (OIDC)
      attestations: write # store provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - name: Verify checksums before attesting
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kepler-*
            dist/SHA256SUMS
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac
          cat > notes.md <<NOTES
          Install: see the README "Install" section (\`install.sh\` / \`install.ps1\`), or download an archive below.

          Verify a download:
          - checksums: \`sha256sum --check --ignore-missing SHA256SUMS\`
          - provenance: \`gh attestation verify <archive> --repo ${REPO}\`

          Binaries are not code-signed or notarized (macOS Gatekeeper / Windows SmartScreen may warn); integrity
          is provided by SHA256SUMS and the build-provenance attestation. License: MIT.
          NOTES
          gh release create "$TAG" --repo "$REPO" --verify-tag $prerelease \
            --title "Kepler $TAG" --notes-file notes.md --generate-notes \
            dist/kepler-* dist/SHA256SUMS
